                  content: '<h3 class="default-heading3"><span style="color: rgb(255, 152, 0);">Rückblick&nbsp;</span></h3><h2 class="default-heading2">Unsere erfolgreiche Auftaktveranstaltung am 21. Juni 2026</h2>'
                -
                  customBlockId: null
                  id: 2b2c719f-01de-4e7f-9a85-881a40554a6a
                  isCustomBlock: null
                  moduleName: null
                  sidebarSection: null
                  stylable: false
                  thumbnail: /assets/img/editor/element_text.svg
                  title: Texte
                  type: text
                  layout:
                    320px:
                      width: 100%
