                      removeMargin: false
                      removePadding: false
                      text-align: left
                      text-valign: top
                      valign: top
                      width: 100%
                  content: '<p>Jetzt heißt es: <strong>Am Ball bleiben!</strong> Wir haben die Aufmerksamkeit der Entscheidungsträger gewonnen. Nun müssen wir zeigen, wie wichtig den Bürgerinnen und Bürgern dieses Thema ist.</p><p>Wir laden Sie alle herzlich zu unserem nächsten großen Meilenstein ein:</p><p><br></p><p><strong>Großer öffentlicher Ortstermin</strong><br>• Wann: Donnerstag, 2. Juli 2026, ab 16:30 Uhr<br>• Wo: Rückhaltebecken Schmaler Weg 11, 41748 Viersen</p><p><br></p><p class="default"><strong>Warum ist dieser Termin so entscheidend?</strong></p><p><span style="font-style: normal; font-weight: 400;" id="isPasted">Wir haben für den Ortstermin wichtige Entscheidungsträger eingeladen: Vertreter der Stadt- und Kreisverwaltung und deren Ratsfraktionen, den Wasser- und Bodenverband Mittlere Niers (als Eigentümer der Regenrückhaltebecken), die Untere Wasserbehörde, die Untere Naturschutzbehörde, die Landwirtschaftskammer, den NABU sowie die lokale Presse.</span></p><p><span style="font-style: normal; font-weight: 400;" id="isPasted">Dies ist unsere Chance, direkt vor Ort am Rückhaltebecken unsere Sorgen vorzubringen und konstruktive Vorschläge zu äußern. Je mehr wir sind, desto lauter ist unsere Stimme!</span></p>'
